<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Forge Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="landing-view" id="landingView" aria-label="Start a Data Forge Lab run">
        <form class="prompt-box" id="promptForm">
          <textarea
            id="promptInput"
            rows="1"
            spellcheck="true"
            placeholder="Fine-tune a small model for..."
          ></textarea>
          <div class="prompt-actions">
            <button class="send-button" id="startButton" type="submit" aria-label="Start run">↑</button>
          </div>
        </form>
      </section>

      <section class="run-view hidden" id="runView" aria-label="Data Forge Lab run">
        <header class="run-header">
          <div>
            <p class="kicker" id="runTaskType">Data Forge Lab</p>
            <h1 id="runTitle">Run</h1>
          </div>
          <div class="run-status">
            <span id="loopCount">0/0</span>
            <span id="runStatus">ready</span>
          </div>
        </header>

        <section class="focus-stage" aria-label="Current agent step">
          <div class="focus-copy">
            <div class="step-marker" id="activeStepMarker"></div>
            <div>
              <p class="kicker" id="activeAgent">Agent</p>
              <h2 id="activeTitle">Waiting</h2>
              <p id="activeSummary"></p>
            </div>
          </div>
          <div class="focus-metrics" id="activeMetrics"></div>
          <div class="approval-block hidden" id="approvalBlock"></div>
          <div class="focus-actions">
            <button class="secondary-action" id="backButton" type="button">New prompt</button>
            <button class="primary-action" id="runNextButton" type="button" disabled>Run next step</button>
          </div>
        </section>

        <section class="plan-shell" aria-label="Agent plan">
          <ol class="plan-list" id="steps"></ol>
        </section>

        <section class="evidence-dock hidden" id="evidenceDock" aria-label="Current artifacts">
          <div>
            <p class="kicker">Evidence</p>
            <div id="artifactList"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./demo-run.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
